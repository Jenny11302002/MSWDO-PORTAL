<ellipse cx="1160" cy="440" rx="88" ry="44" fill="#E6F4F1" stroke="#087E78" stroke-width="2"/><text x="1160" y="445" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle"><tspan x="1160" dy="0">completed</tspan></text>
