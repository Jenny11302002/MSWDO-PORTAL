    <path d="M86 470 H422 V482 H86 Z" fill="#087E78"/>
    <text x="102" y="467" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="102" dy="0">«requirement» REQ-02</tspan></text>
    <text x="102" y="507" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="102" dy="0">Applicant can retrieve request</tspan><tspan x="102" dy="17.55">status by reference number.</tspan></text>
<rect x="538" y="210" width="336" height="160" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
