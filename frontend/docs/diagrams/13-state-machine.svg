<text x="1332" y="67" fill="#087E78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1332" dy="0">13 / 17</tspan></text>

<circle cx="110" cy="440" r="16" fill="#17343B"/>
