    <text x="1006" y="467" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="1006" dy="0">«requirement» REQ-06</tspan></text>
    <text x="1006" y="507" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="1006" dy="0">Staff can update request status</tspan><tspan x="1006" dy="17.55">using the supported status set.</tspan></text>
