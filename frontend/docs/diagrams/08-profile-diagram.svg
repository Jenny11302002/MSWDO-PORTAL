    <text x="548" y="449" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="548" dy="0">tag: framework = Laravel</tspan><tspan x="548" dy="17.55">tag: auth = Sanctum where protected</tspan></text>
