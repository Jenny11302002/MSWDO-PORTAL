<text x="1332" y="67" fill="#087E78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1332" dy="0">17 / 17</tspan></text>

<rect x="86" y="210" width="336" height="160" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
    <path d="M87 252 H421" stroke="#D5E2DF" stroke-width="1.5"/>
