<title id="title">Sequence Diagram — MSWDO Online Service Portal</title><desc id="desc">Chronological API interaction for submitting a service request; file upload is a separate optional operation after a reference is issued.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#587178"/></marker></defs>
<rect width="1440" height="900" fill="#F4F8F7"/>
<rect x="0" y="0" width="1440" height="9" fill="#087E78"/>
<text x="64" y="43" fill="#087E78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" text-anchor="start"><tspan x="64" dy="0">MSWDO ONLINE SERVICE PORTAL  /  BEHAVIORAL BLUEPRINT</tspan></text>
<text x="64" y="91" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" text-anchor="start"><tspan x="64" dy="0">Sequence Diagram</tspan></text>
<text x="64" y="121" fill="#587178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="start"><tspan x="64" dy="0">Chronological API interaction for submitting a service request; file upload is a separate optional operation after a reference is issued.</tspan></text>
<rect x="1288" y="45" width="88" height="34" rx="17" fill="#E6F4F1"/>
<text x="1332" y="67" fill="#087E78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1332" dy="0">12 / 17</tspan></text>

<text x="175" y="192" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="175" dy="0">Applicant</tspan></text>
<text x="445" y="192" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="445" dy="0">React SPA</tspan></text>
<text x="730" y="192" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="730" dy="0">Laravel API</tspan></text>
<text x="1010" y="192" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="1010" dy="0">ServiceRequestController</tspan></text>
<text x="1280" y="192" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="1280" dy="0">MySQL</tspan></text>
<rect x="101" y="208" width="148" height="54" rx="12" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/><line x1="175" y1="262" x2="175" y2="778" stroke="#D5E2DF" stroke-width="1.7" stroke-dasharray="7 7"/><rect x="371" y="208" width="148" height="54" rx="12" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/><line x1="445" y1="262" x2="445" y2="778" stroke="#D5E2DF" stroke-width="1.7" stroke-dasharray="7 7"/><rect x="656" y="208" width="148" height="54" rx="12" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/><line x1="730" y1="262" x2="730" y2="778" stroke="#D5E2DF" stroke-width="1.7" stroke-dasharray="7 7"/><rect x="936" y="208" width="148" height="54" rx="12" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/><line x1="1010" y1="262" x2="1010" y2="778" stroke="#D5E2DF" stroke-width="1.7" stroke-dasharray="7 7"/><rect x="1206" y="208" width="148" height="54" rx="12" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/><line x1="1280" y1="262" x2="1280" y2="778" stroke="#D5E2DF" stroke-width="1.7" stroke-dasharray="7 7"/>
<line x1="175" y1="310" x2="445" y2="310" stroke="#477B9E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310" y="296" fill="#477B9E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="310" dy="0">1. Enter and submit form</tspan></text>
<line x1="445" y1="368" x2="730" y2="368" stroke="#087E78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="588" y="354" fill="#087E78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="588" dy="0">2. POST /api/service-requests</tspan></text>
<line x1="730" y1="426" x2="1010" y2="426" stroke="#087E78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="412" fill="#087E78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="870" dy="0">3. Validate request fields</tspan></text>
<line x1="1010" y1="484" x2="1280" y2="484" stroke="#4F9B73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1145" y="470" fill="#4F9B73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1145" dy="0">4. INSERT request (pending + reference)</tspan></text>
<line x1="1280" y1="542" x2="1010" y2="542" stroke="#4F9B73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1145" y="528" fill="#4F9B73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="1145" dy="0">5. Return saved record</tspan></text>
<line x1="1010" y1="600" x2="730" y2="600" stroke="#4F9B73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="586" fill="#4F9B73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="870" dy="0">6. Return 201 + request data</tspan></text>
<line x1="730" y1="658" x2="445" y2="658" stroke="#477B9E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="588" y="644" fill="#477B9E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="588" dy="0">7. JSON confirmation</tspan></text>
<line x1="445" y1="716" x2="175" y2="716" stroke="#477B9E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310" y="702" fill="#477B9E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="310" dy="0">8. Display reference number</tspan></text>
<rect x="690" y="756" width="620" height="58" rx="10" fill="#FFF4DD" stroke="#E8CD91" stroke-width="1.5"/><text x="704" y="780" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start"><tspan x="704" dy="0">After confirmation, optional upload uses POST /api/public-upload-document with the reference and multipart files.</tspan></text>

<path d="M64 852 H1376" stroke="#D5E2DF" stroke-width="1.5"/>
<text x="64" y="879" fill="#587178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="450" text-anchor="start"><tspan x="64" dy="0">MSWDO Online Service Portal  •  Vector diagram  •  Based on the current application and Docker configuration</tspan></text>
</svg>