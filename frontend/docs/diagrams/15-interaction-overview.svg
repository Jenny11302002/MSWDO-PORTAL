    <text x="1026" y="461" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="1026" dy="0">«interaction» TrackRequest</tspan><tspan x="1026" dy="17.55">lookup reference → show status</tspan></text>
