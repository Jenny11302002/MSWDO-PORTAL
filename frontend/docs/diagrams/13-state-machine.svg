<rect x="248" y="678" width="890" height="76" rx="10" fill="#FFF4DD" stroke="#E8CD91" stroke-width="1.5"/><text x="262" y="702" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start"><tspan x="262" dy="0">These are persisted status values, not enforced transition guards. The API validates the selected value but does not restrict a transition path.</tspan></text>

<path d="M64 852 H1376" stroke="#D5E2DF" stroke-width="1.5"/>
<text x="64" y="879" fill="#587178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="450" text-anchor="start"><tspan x="64" dy="0">MSWDO Online Service Portal  •  Vector diagram  •  Based on the current application and Docker configuration</tspan></text>
