<ellipse cx="330" cy="440" rx="88" ry="44" fill="#FFF4DD" stroke="#C58B2B" stroke-width="2"/><text x="330" y="445" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle"><tspan x="330" dy="0">pending</tspan></text>
<ellipse cx="590" cy="440" rx="104" ry="44" fill="#EAF2F8" stroke="#477B9E" stroke-width="2"/><text x="590" y="445" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle"><tspan x="590" dy="0">under_review</tspan></text>
