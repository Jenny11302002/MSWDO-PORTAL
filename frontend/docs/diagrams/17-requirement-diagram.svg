    <text x="1006" y="237" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="1006" dy="0">«requirement» REQ-05</tspan></text>
    <text x="1006" y="277" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="1006" dy="0">Staff access is authenticated</tspan><tspan x="1006" dy="17.55">and protected by role and</tspan><tspan x="1006" dy="17.55">module-permission middleware.</tspan></text>
<rect x="990" y="440" width="360" height="160" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
    <path d="M991 482 H1349" stroke="#D5E2DF" stroke-width="1.5"/>
