    <text x="636" y="253" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="636" dy="0">«interaction» PublicUpload</tspan><tspan x="636" dy="17.55">store bytes + metadata</tspan></text>
