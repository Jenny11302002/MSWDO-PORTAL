<text x="564" y="382" fill="#587178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan x="564" dy="0">No / continue</tspan></text>
<rect x="218" y="572" width="700" height="70" rx="10" fill="#FFF4DD" stroke="#E8CD91" stroke-width="1.5"/><text x="232" y="596" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start"><tspan x="232" dy="0">Optional uploads and tracking are separate portal actions. Staff status changes are reflected in subsequent tracking responses.</tspan></text>

