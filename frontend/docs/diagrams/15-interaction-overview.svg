    <text x="636" y="461" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="636" dy="0">«activity» ReviewRequest</tspan><tspan x="636" dy="17.55">inspect → update status</tspan></text>
