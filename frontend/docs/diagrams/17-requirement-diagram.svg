    <text x="102" y="237" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="102" dy="0">«requirement» REQ-01</tspan></text>
    <text x="102" y="277" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="102" dy="0">Public applicant can submit</tspan><tspan x="102" dy="17.55">a service request and receive</tspan><tspan x="102" dy="17.55">a unique reference number.</tspan></text>
<rect x="86" y="440" width="336" height="160" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
    <path d="M87 482 H421" stroke="#D5E2DF" stroke-width="1.5"/>
