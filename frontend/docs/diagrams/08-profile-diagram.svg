    <text x="998" y="343" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="998" dy="0">tag: allowed = PDF / JPG / PNG</tspan><tspan x="998" dy="17.55">tag: maxUpload = 5 MB per file</tspan></text>
