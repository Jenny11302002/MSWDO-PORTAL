    <text x="554" y="237" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="554" dy="0">«requirement» REQ-03</tspan></text>
    <text x="554" y="277" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="554" dy="0">Request fields are validated;</tspan><tspan x="554" dy="17.55">valid data is persisted with</tspan><tspan x="554" dy="17.55">initial status pending.</tspan></text>
<rect x="538" y="440" width="336" height="160" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
    <path d="M539 482 H873" stroke="#D5E2DF" stroke-width="1.5"/>
    <rect x="538" y="440" width="336" height="42" rx="14" fill="#C58B2B" stroke="#C58B2B" stroke-width="0"/>
    <path d="M538 470 H874 V482 H538 Z" fill="#C58B2B"/>
    <text x="554" y="467" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="554" dy="0">«requirement» REQ-04</tspan></text>
    <text x="554" y="507" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="554" dy="0">Supporting files are restricted</tspan><tspan x="554" dy="17.55">to PDF/JPG/PNG, max 5 MB</tspan><tspan x="554" dy="17.55">per file; metadata is recorded.</tspan></text>
<rect x="990" y="210" width="360" height="160" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
