    <text x="236" y="271" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="236" dy="0">«interaction» SubmitRequest</tspan><tspan x="236" dy="17.55">validate → create → reference</tspan></text>
