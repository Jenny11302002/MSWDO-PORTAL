    <text x="114" y="251" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="114" dy="0">«profile» MSWDO Portal</tspan></text>
    <text x="114" y="291" fill="#17343B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="450" text-anchor="start"><tspan x="114" dy="0">Extends UML Class, Component,</tspan><tspan x="114" dy="17.55">Actor, and Artifact metaclasses</tspan><tspan x="114" dy="17.55">Stereotypes: «portalActor»,</tspan><tspan x="114" dy="17.55">«apiBoundary», «domainRecord»,</tspan><tspan x="114" dy="17.55">«secureFile», «persistentStore»</tspan></text>
<rect x="532" y="196" width="370" height="148" rx="14" fill="#FFFFFF" stroke="#D5E2DF" stroke-width="2"/>
    <path d="M533 238 H901" stroke="#D5E2DF" stroke-width="1.5"/>
