<title id="title">Profile Diagram — MSWDO Online Service Portal</title><desc id="desc">A proposed MSWDO UML profile showing domain-specific stereotypes and tagged values applied to real portal concepts.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#587178"/></marker></defs>
