services:
  mysql:
    image: mysql:8.0
    container_name: mswdo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mswdo_root_2026
      MYSQL_DATABASE: mswdo_portal
      MYSQL_USER: mswdo_user
      MYSQL_PASSWORD: mswdo_password_2026
    ports:
      - "3307:3306"
    volumes:
      - mswdo_mysql_data:/var/lib/mysql
    networks:
      - mswdo-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mswdo-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8085:80"
    depends_on:
      - mysql
    networks:
      - mswdo-network

volumes:
  mswdo_mysql_data:

networks:
  mswdo-network:
    driver: bridge